[workspace]
resolver = "3"
members = [
    "crates/common",
    "services/auth-service",
    "services/catalog-service",
    "services/order-service",
    "services/payment-service",
    "services/notification-service",
    "tools/pg-simulator",
]

# Metadata inherited by every member crate via `xxx.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# The only place crate versions are written. Member crates just write
# `name = { workspace = true }` (optionally adding `features`).
[workspace.dependencies]
common = { path = "crates/common" }

anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
config = { version = "0.15.27", default-features = false }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
uuid = "1.29.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
