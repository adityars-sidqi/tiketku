name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the checks only need to read the repository.
permissions:
  contents: read

# Stop superseded runs on the same ref. Runs on main are never cancelled,
# so every merge commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The job id and name are the required status check in branch protection.
  # Keep both stable.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Keep in sync with rust-toolchain.toml (workspace rust-version is 1.98).
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace
